# A2Z Core CI — enforces the Phase 1 exit criteria (CLAUDE.md §13/§15):
# ruff + mypy --strict clean, full suite green, core/ coverage >= 90%.
#
# Core's own suite runs in-process on moto (see tests/conftest.py) -- no
# service container needed. Omni-Channel's Postgres data-layer tests
# (tests/integration/omnichannel/) are the one exception: there is no
# in-process Postgres emulator equivalent to moto, so the `test` job runs a
# real `postgres` service container (app/services/omnichannel/CLAUDE.md §12).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: mypy app scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a2z
          POSTGRES_PASSWORD: a2z-local-dev-only
          POSTGRES_DB: a2z
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2z -d a2z"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://a2z:a2z-local-dev-only@localhost:5432/a2z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: install postgresql-client (for tests/integration/backup)
        # Pinned via PGDG to match the server's major version (16, same as
        # postgres:16-alpine above) rather than "whatever's current" -- a
        # NEWER client than the server is the more dangerous direction, not
        # the safer one: pg_dump emits a preamble of `SET` statements for
        # session GUCs tied to the *client* tool's own version (e.g. PG17's
        # pg_dump adds `SET transaction_timeout = 0;`), and that preamble
        # replays via psql during restore against the same (older) server --
        # which then rejects it with "unrecognized configuration parameter".
        # Learned the hard way: postgresql-client-17 against this exact
        # postgres:16-alpine broke the restore drill with exactly that
        # error. Matching majors avoids the whole class of GUC-preamble
        # skew, not just the separate "won't dump a newer server" rule.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - name: unit + integration
        run: pytest -m "not load" --cov=app/core --cov=app/services/omnichannel --cov=app/services/invoicing --cov-report=term-missing -q
      # Gated per package rather than on one combined total: each carries its
      # own >=90% bar, and a combined number would let a dip in one hide
      # behind the others. All three read the same coverage data from the run above.
      - name: coverage gate -- app/core >= 90%
        run: coverage report --include="app/core/*" --fail-under=90
      - name: coverage gate -- app/services/omnichannel >= 90%
        run: coverage report --include="app/services/omnichannel/*" --fail-under=90
      - name: coverage gate -- app/services/invoicing >= 90%
        run: coverage report --include="app/services/invoicing/*" --fail-under=90
      - name: load / latency targets (Design §5.4)
        # Latency assertions are jittery on shared runners; advisory for now.
        continue-on-error: true
        run: pytest -m load -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v4
      - name: build monolith image
        run: docker build -t a2z-core:ci .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No project install needed -- the checker uses only the stdlib, so this
      # stays a fast, dependency-free gate. It fails on a broken relative link
      # in any tracked Markdown file, or on a docs/ page missing from
      # docs/INDEX.md (see docs/ci-cd.md).
      - run: python -m scripts.check_docs

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/
      - name: validate each module (no backend/creds needed)
        run: |
          set -euo pipefail
          for mod in infra/modules/*/; do
            echo "== $mod"
            terraform -chdir="$mod" init -backend=false -input=false > /dev/null
            terraform -chdir="$mod" validate
          done
