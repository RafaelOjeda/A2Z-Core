# Local dev backing services. Brings up LocalStack (DynamoDB, S3, SES, SNS,
# EventBridge) and Postgres so integration tests have something real-ish to
# hit. Cognito is not emulated — tests use auth.create_test_token instead.
# Postgres backs Omni-Channel's (and Invoicing's) data layer (shared
# instance, service-owned schemas — CLAUDE.md §2/§12, app/services/
# omnichannel/CLAUDE.md §12): one container serves every service's schema.
# No Redis: single-box MVP (docs/architecture/single-box-mvp.md) replaced it
# with in-process state (core.realtime, core.rate_limit, core.cache).
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,ses,sns,events
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=a2z
      - POSTGRES_PASSWORD=a2z-local-dev-only
      - POSTGRES_DB=a2z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2z -d a2z"]
      interval: 5s
      timeout: 3s
      retries: 10
